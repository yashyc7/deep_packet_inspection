<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Deep Packet Inspection end-to-end pipeline</title>
  <desc id="desc">PCAP input flows through reader, parser, flow tracker, DPI inspection, classifier, rules engine, then to filtered PCAP and reports.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#16835d"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .detail { font-size: 12px; fill: #42526e; }
      .live { fill: #e4f7ef; stroke: #16835d; stroke-width: 2; rx: 12; }
      .line { fill: none; stroke: #16835d; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" class="title">DPI pipeline — capture to filtered output</text>

  <rect x="40" y="70" width="160" height="56" class="live"/>
  <text x="120" y="94" text-anchor="middle" class="label">PCAP input</text>
  <text x="120" y="112" text-anchor="middle" class="detail">offline capture</text>

  <rect x="240" y="70" width="180" height="56" class="live"/>
  <text x="330" y="94" text-anchor="middle" class="label">PCAP reader</text>
  <text x="330" y="112" text-anchor="middle" class="detail">timestamp + bytes</text>

  <rect x="460" y="70" width="180" height="56" class="live"/>
  <text x="550" y="94" text-anchor="middle" class="label">Packet parser</text>
  <text x="550" y="112" text-anchor="middle" class="detail">L2 / L3 / L4 + payload</text>

  <rect x="680" y="70" width="180" height="56" class="live"/>
  <text x="770" y="94" text-anchor="middle" class="label">Flow tracker</text>
  <text x="770" y="112" text-anchor="middle" class="detail">five-tuple table</text>

  <rect x="900" y="70" width="160" height="56" class="live"/>
  <text x="980" y="94" text-anchor="middle" class="label">DPI inspect</text>
  <text x="980" y="112" text-anchor="middle" class="detail">SNI / Host / DNS</text>

  <path d="M200 98H232" class="line"/>
  <path d="M420 98H452" class="line"/>
  <path d="M640 98H672" class="line"/>
  <path d="M860 98H892" class="line"/>

  <rect x="240" y="220" width="200" height="64" class="live"/>
  <text x="340" y="246" text-anchor="middle" class="label">Classifier</text>
  <text x="340" y="266" text-anchor="middle" class="detail">map domain → AppType</text>

  <rect x="500" y="220" width="200" height="64" class="live"/>
  <text x="600" y="246" text-anchor="middle" class="label">Rules engine</text>
  <text x="600" y="266" text-anchor="middle" class="detail">IP / app / domain</text>

  <rect x="760" y="220" width="200" height="64" class="live"/>
  <text x="860" y="246" text-anchor="middle" class="label">Forward or drop</text>
  <text x="860" y="266" text-anchor="middle" class="detail">per-flow decision</text>

  <path d="M980 126V190H340V212" class="line"/>
  <path d="M440 252H492" class="line"/>
  <path d="M700 252H752" class="line"/>

  <rect x="280" y="380" width="240" height="70" class="live"/>
  <text x="400" y="410" text-anchor="middle" class="label">Filtered PCAP</text>
  <text x="400" y="430" text-anchor="middle" class="detail">allowed packets only</text>

  <rect x="620" y="380" width="240" height="70" class="live"/>
  <text x="740" y="410" text-anchor="middle" class="label">Processing report</text>
  <text x="740" y="430" text-anchor="middle" class="detail">counts, apps, domains</text>

  <path d="M820 284V340H400V372" class="line"/>
  <path d="M860 284V340H740V372" class="line"/>

  <rect x="120" y="520" width="860" height="140" fill="#f5f8fc" stroke="#52708f" stroke-width="2" rx="12"/>
  <text x="550" y="555" text-anchor="middle" class="label">Packet journey (single-threaded engine)</text>
  <text x="550" y="585" text-anchor="middle" class="detail">1. Read frame → 2. Parse headers → 3. Upsert five-tuple flow</text>
  <text x="550" y="610" text-anchor="middle" class="detail">4. Extract SNI / HTTP Host / DNS when present → 5. Classify application</text>
  <text x="550" y="635" text-anchor="middle" class="detail">6. Evaluate block rules → 7. Write forwarded packets → 8. Print report</text>
</svg>

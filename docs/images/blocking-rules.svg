<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Blocking rules evaluation</title>
  <desc id="desc">A flow is blocked when its source IP, application type, or domain matches configured rules; blocked packets are dropped from the output PCAP.</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#52708f"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .detail { font-size: 12px; fill: #42526e; }
      .box { fill: #f5f8fc; stroke: #52708f; stroke-width: 2; }
      .drop { fill: #fdecea; stroke: #c9372c; stroke-width: 2; }
      .keep { fill: #e4f7ef; stroke: #16835d; stroke-width: 2; }
      .line { fill: none; stroke: #52708f; stroke-width: 2.2; marker-end: url(#arrow2); }
    </style>
  </defs>
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" class="title">Rule evaluation order</text>

  <rect x="60" y="70" width="200" height="70" rx="10" class="box"/>
  <text x="160" y="100" text-anchor="middle" class="label">Classified flow</text>
  <text x="160" y="122" text-anchor="middle" class="detail">IP + App + SNI</text>

  <rect x="320" y="70" width="200" height="70" rx="10" class="box"/>
  <text x="420" y="100" text-anchor="middle" class="label">--block-ip</text>
  <text x="420" y="122" text-anchor="middle" class="detail">exact source match</text>

  <rect x="580" y="70" width="200" height="70" rx="10" class="box"/>
  <text x="680" y="100" text-anchor="middle" class="label">--block-app</text>
  <text x="680" y="122" text-anchor="middle" class="detail">YouTube, Facebook…</text>

  <rect x="780" y="180" width="160" height="70" rx="10" class="box"/>
  <text x="860" y="210" text-anchor="middle" class="label">--block-domain</text>
  <text x="860" y="232" text-anchor="middle" class="detail">substring in SNI</text>

  <path d="M260 105H312" class="line"/>
  <path d="M520 105H572" class="line"/>
  <path d="M780 105H860V172" class="line"/>

  <rect x="180" y="300" width="260" height="90" rx="12" class="drop"/>
  <text x="310" y="340" text-anchor="middle" class="label">DROP</text>
  <text x="310" y="365" text-anchor="middle" class="detail">omit from output.pcap</text>

  <rect x="560" y="300" width="260" height="90" rx="12" class="keep"/>
  <text x="690" y="340" text-anchor="middle" class="label">FORWARD</text>
  <text x="690" y="365" text-anchor="middle" class="detail">write to output.pcap</text>

  <text x="500" y="430" text-anchor="middle" class="detail">Any matching rule marks the whole flow blocked for subsequent packets.</text>
</svg>
